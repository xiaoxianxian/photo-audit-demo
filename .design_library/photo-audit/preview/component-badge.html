<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* @component-css-start */
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-on-surface); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.label { display: inline-block; width: 92px; font-size: 11px; font-weight: 600; color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--rule); margin: 8px 0; }
.badge { display: inline-flex; align-items: center; justify-content: center; padding: 2px 8px; font-size: 12px; font-weight: 500; border-radius: var(--radius-full); white-space: nowrap; line-height: 1.5; min-width: 28px; }
.badge-risk-low { background: var(--color-primary-container); color: var(--color-on-primary-container); }
.badge-risk-medium { background: #fef3c7; color: #92400e; }
.badge-risk-high { background: #fee2e2; color: #991b1b; }
.badge-status-passed { background: #d1fae5; color: #065f46; }
.badge-status-rejected { background: #fee2e2; color: #991b1b; }
.badge-status-pending { background: #dbeafe; color: #1e40af; }
.badge-count { background: var(--error); color: #ffffff; border-radius: var(--radius-full); font-size: 12px; min-width: 20px; height: 20px; padding: 0 6px; }
.badge-ai-tag { background: #fae8ff; color: #701a75; }
.badge-ai-tag-danger { background: #fee2e2; color: #991b1b; }
</style>
<div class="row"><span class="label">风险等级</span><span class="badge badge-risk-low" data-evidence-sample="risk-low">低风险</span><span class="badge badge-risk-medium" data-evidence-sample="risk-medium">中风险</span><span class="badge badge-risk-high" data-evidence-sample="risk-high">高风险</span></div>
<hr class="divider">
<div class="row"><span class="label">审核状态</span><span class="badge badge-status-passed" data-evidence-sample="status-passed">已通过</span><span class="badge badge-status-rejected" data-evidence-sample="status-rejected">已驳回</span><span class="badge badge-status-pending" data-evidence-sample="status-pending">待审核</span></div>
<hr class="divider">
<div class="row"><span class="label">数量徽章</span><span class="badge badge-count" data-evidence-sample="count-zero">0</span><span class="badge badge-count" data-evidence-sample="count-single">5</span><span class="badge badge-count" data-evidence-sample="count-multi">99+</span></div>
<hr class="divider">
<div class="row"><span class="label">AI 标签</span><span class="badge badge-ai-tag" data-evidence-sample="ai-label-violence">涉暴</span><span class="badge badge-ai-tag" data-evidence-sample="ai-label-ad">广告引流</span><span class="badge badge-ai-tag-danger" data-evidence-sample="ai-label-sensitive">敏感信息</span></div>
