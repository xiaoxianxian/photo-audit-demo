<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>按钮预览 - Photo Audit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-on-surface); }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .label { width: 92px; font-size: 12px; color: var(--color-muted); flex-shrink: 0; text-align: right; line-height: 32px; }
  hr.divider { border: none; border-top: 1px solid var(--rule); margin: 8px 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; cursor: pointer; font-family: var(--font-body); font-size: 14px; font-weight: 500; white-space: nowrap; border-radius: var(--radius-md); transition: background var(--duration-fast), border-color var(--duration-fast); text-decoration: none; line-height: 1; }
  .btn-primary { background: var(--accent); color: var(--color-on-primary); padding: 0 24px; height: var(--size-button-height-md); min-width: var(--size-button-height-md); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger { background: var(--error); color: var(--on-error); padding: 0 24px; height: var(--size-button-height-md); min-width: var(--size-button-height-md); }
  .btn-danger:hover { background: var(--audit-error-700); }
  .btn-ghost { background: transparent; color: var(--color-on-surface); padding: 0 12px; height: var(--size-button-height-md); min-width: var(--size-button-height-md); border: 1px solid var(--rule); }
  .btn-ghost:hover { background: var(--interactive-hover); }
  .btn-sm { height: var(--size-button-height-sm); padding: 0 16px; font-size: 12px; min-width: var(--size-button-height-sm); }
  .btn-danger-sm { height: var(--size-button-height-sm); padding: 0 16px; font-size: 12px; min-width: var(--size-button-height-sm); }
  .btn-ghost-sm { height: var(--size-button-height-sm); padding: 0 8px; font-size: 12px; min-width: var(--size-button-height-sm); }
  /* @component-css-start */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; cursor: pointer; font-family: var(--font-body); font-size: 14px; font-weight: 500; white-space: nowrap; border-radius: var(--radius-md); transition: background var(--duration-fast), border-color var(--duration-fast); text-decoration: none; line-height: 1; }
  .btn-primary { background: var(--accent); color: var(--color-on-primary); padding: 0 24px; height: var(--size-button-height-md); min-width: var(--size-button-height-md); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger { background: var(--error); color: var(--on-error); padding: 0 24px; height: var(--size-button-height-md); min-width: var(--size-button-height-md); }
  .btn-danger:hover { background: var(--audit-error-700); }
  .btn-ghost { background: transparent; color: var(--color-on-surface); padding: 0 12px; height: var(--size-button-height-md); min-width: var(--size-button-height-md); border: 1px solid var(--rule); }
  .btn-ghost:hover { background: var(--interactive-hover); }
  .btn-sm { height: var(--size-button-height-sm); padding: 0 16px; font-size: 12px; min-width: var(--size-button-height-sm); }
  .btn-danger-sm { height: var(--size-button-height-sm); padding: 0 16px; font-size: 12px; min-width: var(--size-button-height-sm); }
  .btn-ghost-sm { height: var(--size-button-height-sm); padding: 0 8px; font-size: 12px; min-width: var(--size-button-height-sm); }
  /* @component-css-end */
</style>
</head>
<body>

<div class="row">
  <span class="label">主要操作</span>
  <button class="btn btn-primary">通过审核</button>
  <button class="btn btn-primary">提交申诉</button>
  <button class="btn btn-primary">批量通过</button>
</div>

<div class="row">
  <span class="label">危险操作</span>
  <button class="btn btn-danger">打回重审</button>
  <button class="btn btn-danger">撤销通过</button>
</div>

<hr class="divider">

<div class="row">
  <span class="label">次要操作</span>
  <button class="btn btn-ghost">取消</button>
  <button class="btn btn-ghost">查看详情</button>
</div>

<div class="row">
  <span class="label">表格紧凑</span>
  <button class="btn btn-primary btn-sm">通过</button>
  <button class="btn btn-danger btn-sm">打回</button>
  <button class="btn btn-ghost btn-sm">更多</button>
</div>

</body>
</html>
